name: Install Playwright Chromium

on:
  push:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to open and capture'
        required: true
        type: string

jobs:
  install-playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium with deps
        run: |
          npm i -D playwright
          npx playwright install chromium --with-deps

      - name: Capture page screenshot
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
        run: |
          npx playwright screenshot --full-page "$TARGET_URL" shot.png

      - name: Upload screenshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: page-capture
          path: shot.png
          retention-days: 7